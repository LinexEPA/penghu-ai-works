<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品管理</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="login" class="shell login"><div class="card"><h1>講師管理</h1><p class="muted">只有管理者可下載或刪除作品。</p><div class="field"><label>管理密碼</label><input id="adminKey" type="password" autocomplete="current-password"></div><div id="loginMsg" class="hidden"></div><button id="loginBtn" class="btn primary wide">進入管理</button></div></div>
<div id="app" class="shell hidden"><div class="topbar"><div class="brand"><h1 id="courseName">講師管理</h1><p>下載、刪除與作品確認</p></div><div><button id="refresh" class="btn ghost">重新整理</button> <button id="logout" class="btn ghost">登出</button></div></div><div class="card" style="margin-bottom:16px"><div class="works-head"><div><strong>課程控制</strong><div class="muted" id="courseState" style="margin-top:5px"></div></div><button id="toggleOpen" class="btn primary">停止收件</button></div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px"><div><label class="muted">學員上傳網址</label><div style="display:flex;gap:8px;margin-top:6px"><input id="uploadUrl" readonly style="flex:1;padding:11px;border:1px solid var(--line);border-radius:10px"><button id="copyUpload" class="btn ghost">複製</button></div></div><div><label class="muted">講師展示網址</label><div style="display:flex;gap:8px;margin-top:6px"><input id="showUrl" readonly style="flex:1;padding:11px;border:1px solid var(--line);border-radius:10px"><button id="copyShow" class="btn ghost">複製</button></div></div></div></div><div class="card"><div class="works-head"><strong id="count">0 件作品</strong><span class="muted">下載連結為短效授權</span></div><div id="msg" class="hidden" style="margin-top:12px"></div><div id="list" class="admin-list" style="margin-top:16px"></div></div></div>
<script type="module" src="/admin.js"></script></body></html>
