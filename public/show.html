<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品展示</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="shell"><div class="topbar"><div class="brand"><h1 id="courseName">作品展示</h1><p>講師展示板｜點選作品即可放大</p></div><button id="refresh" class="btn ghost">重新整理</button></div>
<div class="card"><div class="works-head"><div><strong id="count">目前收到 0 件作品</strong><div id="groups" class="muted" style="margin-top:5px"></div></div><div class="muted">每 5 秒自動更新</div></div><div id="filters" class="filters"></div><div id="error" class="hidden"></div><div id="works" class="works-grid"></div></div></div>
<div id="modal" class="modal"><div class="modalbar"><strong id="modalTitle"></strong><button id="close" class="close">×</button></div><button id="prev" class="navbtn prev">‹</button><div id="stage" class="stage"></div><button id="next" class="navbtn next">›</button></div>
<script type="module" src="/show.js"></script></body></html>
